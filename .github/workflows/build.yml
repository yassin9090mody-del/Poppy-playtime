name: Build PSP Homebrew

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with PSPDEV
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/source" \
            pspdev/pspdev:latest \
            bash -lc "export PSPDEV=/usr/local/pspdev && export PATH=\$PSPDEV/bin:\$PATH && cd /source && rm -rf build && mkdir build && cd build && psp-cmake .. && make"

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: FactoryHorror-EBOOT
          path: build/EBOOT.PBP
